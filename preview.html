        var w = (s.w != null && s.w > 0) ? s.w : null;
        var g = groups[groups.length - 1];
        if (g && g.w === w) g.reps.push(s.r);
        else groups.push({ w: w, reps: [s.r] });
      });
      return groups;
    }
    function itemSummary(it) {
      if (isCardioItem(it)) return fmtNum(it.minutes || 0) + "分";
      if (!it.sets.length) return "自重";
      return groupSets(it).map(function (g) { return weightText(g.w, it.weight_type) + " × " + g.reps.join("・"); }).join(" / ") + "（" + it.sets.length + "セット）";
    }
    function sessionStats(endMs) {
      var sets = 0, vol = 0, cardio = 0;
      sess.items.forEach(function (it) {
        if (isCardioItem(it)) { cardio += it.minutes || 0; return; }
        sets += it.sets.length;
        it.sets.forEach(function (s) {
          var tot = totalKgOf(it, s.w);
          if (tot != null) vol += tot * s.r;
        });
      });
      return { ms: Math.max(0, endMs - startMs()), count: sess.items.length, sets: sets, volume: round2(vol), cardio: round2(cardio) };
    }
    // 1種目 → 保存用エントリ配列（連続する同重量ごとに1エントリ。data.json と同じ weight_kg + reps[] 形）
    function itemToEntries(it, date, time, durMin) {
      var list = [];
      if (isCardioItem(it)) {
        // data.json の有酸素と同じ形（minutes、reps/sets は null、weight_type は "-"）
        list.push({ id: newLocalId(), date: date, time: time, exercise: it.exercise, part: "有酸素", weight_kg: null, weight_type: "-", reps: null, sets: null, minutes: it.minutes, unknown: [], note: it.note || null, raw: "", load_kg: null, load_reps: null, volume_kg: null, hands: null });
      } else {
        var groups = groupSets(it);
        if (!groups.length) groups = [{ w: null, reps: [] }];
        groups.forEach(function (g, gi) {
          var hasW = g.w != null;
          var total = totalKgOf(it, g.w);
          var sum = g.reps.reduce(function (a, r) { return a + r; }, 0);
          list.push({
            id: newLocalId(), date: date, time: time, exercise: it.exercise, part: it.part || "不明",
            weight_kg: hasW ? g.w : null, weight_type: hasW ? it.weight_type : "自重",
            reps: g.reps.slice(), sets: g.reps.length || null, note: gi === 0 ? (it.note || null) : null, raw: "",
            volume_kg: (hasW && g.reps.length) ? round2(total * sum) : null,
            total_kg: total, unknown: [], load_kg: null, load_reps: null,
            hands: (hasW && it.weight_type === "片手") ? "両手" : null
          });
        });
      }
      list.forEach(function (entry) {
        entry.raw = pad2(+date.slice(5, 7)) + "/" + pad2(+date.slice(8, 10)) + " " + time + ": " + entrySummary(entry) + "（セッション記録・所要時間 約" + durMin + "分）";
      });
      return list;
    }

    // ---------- 休憩タイマー ----------
    function vibrate() {
      try { if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 500]); } catch (e) {}
    }
    function clearDoneTimer() { if (rest.doneTimer) { clearTimeout(rest.doneTimer); rest.doneTimer = null; } }
    function startRest() {
      if (!sess) return;
      clearDoneTimer();
      rest.total = sess.restSec;
      rest.startAt = Date.now();
      rest.endAt = rest.startAt + rest.total * 1000;
      rest.running = true;
      rest.done = false;
      updateRestUi();
    }
    function stopRest() {
      clearDoneTimer();
      rest.running = false;
      rest.done = false;
      updateRestUi();
    }
    function finishRest() {
      rest.running = false;
      rest.done = true;
      clearDoneTimer();
      rest.doneTimer = setTimeout(stopRest, 10000);
      vibrate();
      updateRestUi();
    }
    function restBarHtml() {
      var presets = REST_PRESETS.map(function (p) {
        return '<button type="button" class="sess-rp' + (p === sess.restSec ? " on" : "") + '" data-sact="rest-preset" data-sec="' + p + '" aria-label="休憩' + p + '秒">' + p + "</button>";
      }).join("");
      return '<div class="sess-rest" id="sessRestBar">' +
        '<div class="sess-ring"><svg viewBox="0 0 48 48" aria-hidden="true"><circle class="trk" cx="24" cy="24" r="20"/><circle class="prg" id="sessRing" cx="24" cy="24" r="20" stroke-dasharray="' + RING_C.toFixed(2) + '" stroke-dashoffset="0" transform="rotate(-90 24 24)"/></svg><span id="sessRestTime"></span></div>' +
        '<div class="sess-rest-mid"><div class="sess-rest-cap" id="sessRestCap">休憩タイマー（秒）</div><div class="sess-rps">' + presets + "</div></div>" +
        '<button type="button" class="sess-skip" id="sessSkipBtn" data-sact="rest-skip">スキップ</button></div>';
    }
    function renderRestBar(show) {
      $("sessRest").innerHTML = (show && sess) ? restBarHtml() : "";
      updateRestUi();
    }
    function updateRestUi() {
      var bar = $("sessRestBar");
      if (!bar || !sess) return;
      var total = (rest.running || rest.done) ? rest.total : sess.restSec;
      var remain = rest.running ? Math.max(0, (rest.endAt - Date.now()) / 1000) : (rest.done ? 0 : sess.restSec);
      $("sessRestTime").textContent = minSec(remain);
      var frac = total > 0 ? Math.min(1, remain / total) : 0;
      $("sessRing").setAttribute("stroke-dashoffset", (RING_C * (1 - frac)).toFixed(2));
      bar.className = "sess-rest" + (rest.running ? " run" : "") + (rest.done ? " done" : "");
      $("sessRestCap").textContent = rest.done ? "休憩終了！次のセットへ" : (rest.running ? "休憩中" : "休憩タイマー（秒）");
      var skip = $("sessSkipBtn");
      skip.textContent = rest.done ? "OK" : "スキップ";
      skip.disabled = !(rest.running || rest.done);
    }

    // ---------- 時計（1つのタイマーで経過時間・休憩を更新） ----------
    function updateEntryBtn() {
      var lab = $("sessionOpenLabel"), btn = $("sessionOpenBtn");
      if (!lab || !btn) return;
      var txt, html;
      if (sess) {
        var c = clock(Date.now() - startMs());
        txt = "トレーニング中（経過 " + c + "）";
        html = "トレーニング中<small>（経過 " + c + "）</small>";
      } else {
        txt = "トレーニングを記録する";
        html = txt;
      }
      if (txt === entryBtnText) return;
      entryBtnText = txt;
      lab.innerHTML = html;
      btn.classList.toggle("live", !!sess);
    }
    function tick() {
      if (sess) {
        updateEntryBtn();
        var el = $("sessElapsed");
        if (el && sv.open && sv.view === "session") el.textContent = clock(Date.now() - startMs());
      }
      if (rest.running) {
        if (Date.now() >= rest.endAt) finishRest();
        else updateRestUi();
      }
    }

    // ---------- 描画ヘルパ ----------
    function partChip(part, on, act) {
      var c = PART_COLORS[part] || "#aaa";
      return '<button type="button" class="sess-chip part' + (on ? " on" : "") + '" style="--pc:' + c + '" aria-pressed="' + (on ? "true" : "false") + '" data-sact="' + act + '" data-part="' + escapeHtml(part) + '"><span class="dot"></span>' + escapeHtml(part) + "</button>";
    }
    function nameChip(name, act, quick) {
      return '<button type="button" class="sess-chip' + (quick ? " quick" : "") + '" data-sact="' + act + '" data-name="' + escapeHtml(name) + '">' + escapeHtml(name) + "</button>";
    }
    function headBtn(label, act, cls) {
      return '<button type="button" class="sess-head-btn' + (cls ? " " + cls : "") + '" data-sact="' + act + '">' + label + "</button>";
    }
    function headHtml(left, mid, right) {
      return '<div class="sess-head-side">' + (left || "") + '</div><div class="sess-head-mid">' + mid + '</div><div class="sess-head-side right">' + (right || "") + "</div>";
    }
    function titleMid(title, sub) {
      return '<div class="sess-title">' + escapeHtml(title) + "</div>" + (sub ? '<div class="sess-sub">' + escapeHtml(sub) + "</div>" : "");
    }
    function menuLink() {
      return '<button type="button" class="sess-linkbtn" data-sact="menus"><span>部位メニューの設定</span>' + ICON_CHEVRON_RIGHT + "</button>";
    }
    function freeRow(act, id, val) {
      return '<div class="sess-free"><input class="ef-input" id="' + id + '" type="text" placeholder="種目名を入力" data-sin="' + (id === "sessFree" ? "free" : "mfree") + '" value="' + escapeHtml(val) + '" autocomplete="off"><button type="button" class="sess-btn inline" data-sact="' + act + '">追加</button></div>';
    }

    // ---------- 各画面 ----------
    function viewStart() {
      var chips = allParts().map(function (p) { return partChip(p, sv.startParts.indexOf(p) !== -1, "start-part"); }).join("");
      return {
        head: headHtml(headBtn("閉じる", "close"), titleMid("トレーニングを開始", formatDateLabel(todayStr()))),
        body: '<div class="card"><div class="section-title">今日鍛える部位</div><div class="sess-hint">タップして選択（複数OK）。種目の追加時は他の部位も選べます。</div><div class="sess-chips">' + chips + "</div></div>" + menuLink(),
        foot: '<button type="button" class="sess-btn primary" data-sact="start">トレーニングを開始</button>'
      };
    }
    function itemCard(it, i) {
      var c = PART_COLORS[it.part] || "#aaa";
      var h = '<div class="sess-item" style="--pc:' + c + '"><div class="sess-item-top"><span class="sess-item-name">' + escapeHtml(it.exercise) + "</span>" + partChipHtml(it.part) + "</div>";
      h += '<div class="sess-item-sum">' + escapeHtml(itemSummary(it)) + "</div>";
      if (it.note) h += '<div class="sess-item-note">' + escapeHtml(it.note) + "</div>";
      h += '<div class="sess-item-act"><button type="button" class="sess-mini" data-sact="edit" data-i="' + i + '">編集</button><button type="button" class="sess-mini danger" data-sact="del" data-i="' + i + '">削除</button></div></div>';
      return h;
    }
    function viewSession() {
      var mid = '<div class="sess-clock" id="sessElapsed">' + clock(Date.now() - startMs()) + '</div><div class="sess-sub">' + escapeHtml(formatDateLabel(sess.date)) + " ・ 開始 " + startHHMM() + "</div>";
      var body = "";
      if (sess.parts.length) body += '<div class="part-chip-row">' + sess.parts.map(partChipHtml).join("") + "</div>";
      if (sess.items.length) body += sess.items.map(itemCard).join("");
      else body += '<div class="sess-empty">まだ種目がありません。<br>「種目を追加」から記録を始めましょう。</div>';
      return {
        head: headHtml(headBtn("閉じる", "close"), mid, headBtn("破棄する", "discard", "danger")),
        body: body,
        foot: '<button type="button" class="sess-btn primary" data-sact="add">種目を追加</button><button type="button" class="sess-btn" data-sact="end">トレーニングを終了</button>'
      };
    }
    function viewAdd() {
      var part = sv.addPart;
      var menu = menuFor(part);
      var past = namesForPart(part).filter(function (n) { return menu.indexOf(n) === -1; }).slice(0, 60);
      var body = '<div class="card"><div class="section-title">部位</div><div class="sess-chips">' + allParts().map(function (p) { return partChip(p, p === part, "add-part"); }).join("") + "</div></div>";
      body += '<div class="card"><div class="section-title">' + escapeHtml(part) + "のメニュー</div>";
      body += menu.length ? '<div class="sess-chips">' + menu.map(function (n) { return nameChip(n, "pick", true); }).join("") + "</div>" : '<div class="sess-hint" style="margin:0">メニュー未設定です。下の「部位メニューの設定」から登録できます。</div>';
      body += "</div>";
      body += '<div class="card"><div class="section-title">過去にやった種目</div>';
      body += past.length ? '<div class="sess-chips">' + past.map(function (n) { return nameChip(n, "pick", false); }).join("") + "</div>" : '<div class="sess-hint" style="margin:0">ほかの過去種目はありません。</div>';
      body += "</div>";
      body += '<div class="card"><div class="section-title">新しい種目</div>' + freeRow("pick-free", "sessFree", sv.freeText) + "</div>";
      body += menuLink();
      return { head: headHtml(headBtn("‹ 戻る", "add-back"), titleMid("種目を追加", part)), body: body, foot: "" };
    }
    function setsHtml(d) {
      return d.sets.map(function (s, i) {
        return '<div class="sess-set"><span class="sess-set-n">' + (i + 1) + "</span>" +
          '<input class="ef-input" type="number" inputmode="decimal" step="any" min="0" placeholder="自重" aria-label="' + (i + 1) + 'セット目の重量（kg）" data-sin="w" data-i="' + i + '" value="' + escapeHtml(s.w) + '">' +
          '<span class="sess-unit">kg</span>' +
          '<input class="ef-input" type="number" inputmode="numeric" min="0" max="999" placeholder="回数" aria-label="' + (i + 1) + 'セット目の回数" data-sin="reps" data-i="' + i + '" value="' + escapeHtml(s.r) + '">' +
          '<span class="sess-unit">回</span>' +
          '<button type="button" class="sess-done' + (s.done ? " on" : "") + '" data-sact="setdone" data-i="' + i + '" aria-pressed="' + (s.done ? "true" : "false") + '" aria-label="' + (i + 1) + 'セット目を完了">✓</button>' +
          '<button type="button" class="sess-x" data-sact="delset" data-i="' + i + '" aria-label="' + (i + 1) + 'セット目を削除">×</button></div>';
      }).join("");
    }
    function viewEditor() {
      var d = sess.draft, cardio = d.part === "有酸素";
      var body = "";
      var prev = findPrevious(d.exercise, cardio);
      if (prev) body += '<div class="sess-prev"><div class="sess-prev-t">' + escapeHtml(prevText(prev, cardio)) + '</div><button type="button" class="sess-mini" data-sact="copyprev">前回をコピー</button></div>';
      if (cardio) {
        body += '<div class="card"><div class="section-title">時間</div><div class="sess-w-row"><button type="button" class="sess-step" data-sact="wstep" data-t="minutes" data-d="-5">−5</button><input class="ef-input" id="sessMinutes" type="number" inputmode="numeric" min="0" step="any" placeholder="分" aria-label="時間（分）" data-sin="minutes" value="' + escapeHtml(d.minutes) + '"><span class="sess-unit">分</span><button type="button" class="sess-step" data-sact="wstep" data-t="minutes" data-d="5">+5</button></div></div>';
      } else {
        body += '<div class="card"><div class="section-title">重量の種類</div><div class="ef-seg sess-seg" id="sessWt">' +
          ["合計", "片手"].map(function (t) { return '<button type="button" class="ef-seg-btn' + (d.wtype === t ? " active" : "") + '" data-sact="wt" data-w="' + t + '">' + t + "</button>"; }).join("") +
          '</div><div class="sess-hint" style="margin:8px 0 0">全セット共通。自重は重量を空欄に。「片手」は片手あたりの重量で、合計は×2で集計します。</div></div>';
        body += '<div class="card"><div class="section-title">セット</div><div id="sessSets">' + setsHtml(d) + '</div><button type="button" class="sess-addset" data-sact="addset">+セット</button></div>';
      }
      body += '<div class="card"><div class="section-title">メモ（任意）</div><input class="ef-input" id="sessNote" type="text" placeholder="メモ" aria-label="メモ" data-sin="note" value="' + escapeHtml(d.note) + '"></div>';
      return {
        head: headHtml(headBtn("‹ 戻る", "ed-back"), titleMid(d.exercise, d.part)),
        body: body,
        foot: '<button type="button" class="sess-btn primary" data-sact="commit">' + (d.editIdx != null ? "更新する" : "追加する") + "</button>"
      };
    }
    function viewSummary() {
      var st = sessionStats(sv.summaryAt || Date.now());
      var body = '<div class="card"><div class="stat-grid">' +
        '<div class="stat-box"><div class="stat-label">時間</div><div class="stat-value">' + escapeHtml(durationText(st.ms)) + "</div></div>" +
        '<div class="stat-box"><div class="stat-label">種目数</div><div class="stat-value">' + st.count + "</div></div>" +
        '<div class="stat-box"><div class="stat-label">総セット数</div><div class="stat-value">' + st.sets + "</div></div>" +
        '<div class="stat-box"><div class="stat-label">総ボリューム</div><div class="stat-value">' + formatComma(st.volume) + '<span style="font-size:13px"> kg</span></div></div></div>';
      if (st.cardio > 0) body += '<div class="aerobic-row" style="margin-top:10px"><span>有酸素</span><strong>' + fmtNum(st.cardio) + "分</strong></div>";
      body += "</div>";
      body += '<div class="card"><div class="section-title">種目</div>' + sess.items.map(function (it) {
        return '<div class="list-item"><div class="li-left"><span class="li-item">' + escapeHtml(it.exercise) + '</span><span class="li-meta">' + escapeHtml(it.part) + '</span></div><div class="li-right" style="white-space:normal">' + escapeHtml(itemSummary(it)) + "</div></div>";
      }).join("") + "</div>";
      return {
        head: headHtml(headBtn("‹ 戻る", "sum-back"), titleMid("トレーニング終了", formatDateLabel(sess.date))),
        body: body,
        foot: '<button type="button" class="sess-btn" data-sact="sum-back">戻る</button><button type="button" class="sess-btn primary" data-sact="save">保存する</button>'
      };
    }
    function viewMenus() {
      var part = sv.menuPart;
      var menu = menuFor(part);
      var past = namesForPart(part).filter(function (n) { return menu.indexOf(n) === -1; }).slice(0, 60);
      var body = '<div class="card"><div class="section-title">部位</div><div class="sess-chips">' + allParts().map(function (p) { return partChip(p, p === part, "m-part"); }).join("") + "</div></div>";
      body += '<div class="card"><div class="section-title">' + escapeHtml(part) + "のメニュー</div>";
      if (menu.length) {
        body += menu.map(function (n, i) {
          return '<div class="sess-mrow"><span class="sess-mname">' + escapeHtml(n) + "</span>" +
            '<button type="button" class="sess-ico" data-sact="m-up" data-i="' + i + '" aria-label="上へ"' + (i === 0 ? " disabled" : "") + ">↑</button>" +
            '<button type="button" class="sess-ico" data-sact="m-down" data-i="' + i + '" aria-label="下へ"' + (i === menu.length - 1 ? " disabled" : "") + ">↓</button>" +
            '<button type="button" class="sess-mini danger" data-sact="m-del" data-i="' + i + '">削除</button></div>';
        }).join("");
      } else body += '<div class="sess-hint" style="margin:0">メニューは空です。下から追加してください。</div>';
      body += "</div>";
      body += '<div class="card"><div class="section-title">過去の種目から追加</div>';
      body += past.length ? '<div class="sess-chips">' + past.map(function (n) { return nameChip(n, "m-add", false); }).join("") + "</div>" : '<div class="sess-hint" style="margin:0">追加できる過去種目はありません。</div>';
      body += "</div>";
      body += '<div class="card"><div class="section-title">自由入力で追加</div>' + freeRow("m-free", "sessMFree", sv.menuFree) + "</div>";
      return { head: headHtml(headBtn("‹ 戻る", "menus-back"), titleMid("部位メニューの設定", part)), body: body, foot: "" };
    }

    function render() {
      if (!sv.open) return;
      var v = sv.view, r;
      if (v === "start") r = viewStart();
      else if (v === "session") r = viewSession();
      else if (v === "add") r = viewAdd();
      else if (v === "editor") r = viewEditor();
      else if (v === "summary") r = viewSummary();
      else r = viewMenus();
      var body = $("sessBody"), foot = $("sessFoot");
      var top = body.scrollTop;
      $("sessHead").innerHTML = r.head;
      body.innerHTML = r.body;
      foot.innerHTML = r.foot || "";
      foot.style.display = r.foot ? "" : "none";
      body.scrollTop = sv.lastView === v ? top : 0;
      sv.lastView = v;
      renderRestBar(!!sess && (v === "session" || v === "add" || v === "editor"));
    }
    function go(view) { sv.view = view; render(); }

    // ---------- 開閉 ----------
    function openSession() {
      sess = readSession();
      sv.open = true;
      sv.lastView = null;
      sv.summaryAt = null;
      sv.view = sess ? (sess.draft ? "editor" : "session") : "start";
      $("sessOverlay").classList.add("show");
      document.body.classList.add("sess-open");
      updateEntryBtn();
      render();
    }
    function closeUi() {
      sv.open = false;
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      $("sessOverlay").classList.remove("show");
      document.body.classList.remove("sess-open");
    }
    function resetAfterEnd() {
      sess = null;
      stopRest();
      sv.startParts = [];
      sv.addPart = null;
      sv.summaryAt = null;
      sv.view = "start";
      closeUi();
      updateEntryBtn();
    }

    // ---------- 操作 ----------
    function startSession() {
      if (!sv.startParts.length) { showToast("部位を選んでください"); return; }
      var now = new Date();
      sess = { startedAt: now.toISOString(), date: dateToKey(now), items: [], restSec: 90, parts: sv.startParts.slice() };
      if (!writeSession()) { sess = null; return; }
      sv.addPart = sess.parts[0];
      updateEntryBtn();
      go("session");
    }
    function discardSession() {
      if (!window.confirm("このトレーニングを破棄しますか？\n記録は保存されません。")) return;
      sess = null;
      writeSession();
      resetAfterEnd();
      showToast("破棄しました");
    }
    function endSession() {
      if (!sess.items.length) {
        if (window.confirm("記録する種目がありません。このトレーニングを破棄しますか？")) { sess = null; writeSession(); resetAfterEnd(); }
        return;
      }
      sv.summaryAt = Date.now();
      go("summary");
    }
    function saveSession() {
      if (!sess || !sess.items.length) return;
      var endMs = sv.summaryAt || Date.now();
      var durMin = Math.max(1, Math.round((endMs - startMs()) / 60000));
      var date = sess.date, time = startHHMM();
      var loc = readLocal();
      sess.items.forEach(function (it) { itemToEntries(it, date, time, durMin).forEach(function (en) { loc.entries.push(en); }); });
      if (!writeLocal(loc)) { showToast("保存できませんでした（端末の容量を確認）"); return; }
      sess = null;
      writeSession();
      resetAfterEnd();
      focusDateAfterSave(date);
      reapplyLocal();
      showToast("記録しました");
    }
    function newDraft(name, part) {
      var prev = findPrevious(name, part === "有酸素");
      return { exercise: name, part: part, wtype: (prev && prev.entry.weight_type === "片手") ? "片手" : "合計", sets: [{ w: "", r: "", done: false }], minutes: "", note: "", editIdx: null };
    }
    function draftFromItem(it, idx) {
      return {
        exercise: it.exercise, part: it.part,
        wtype: it.weight_type === "片手" ? "片手" : "合計",
        sets: it.sets.length ? it.sets.map(function (s) { return { w: s.w != null ? String(s.w) : "", r: String(s.r), done: true }; }) : [{ w: "", r: "", done: false }],
        minutes: it.minutes != null ? String(it.minutes) : "", note: it.note || "", editIdx: idx
      };
    }
    function draftDirty(d) {
      return !!(d.minutes || d.note || d.sets.some(function (s) { return s.r || s.done; }));
    }
    function openEditor(name) {
      sess.draft = newDraft(name, sv.addPart);
      sv.freeText = "";
      writeSession();
      go("editor");
    }
    function commitDraft() {
      var d = sess && sess.draft;
      if (!d) return;
      var note = (d.note || "").trim();
      var item;
      if (d.part === "有酸素") {
        var mi = parseFloat(d.minutes);
        if (!isFinite(mi) || mi <= 0) { showToast("時間（分）を入力してください"); return; }
        item = { exercise: d.exercise, part: d.part, weight_type: "-", sets: [], minutes: Math.round(mi * 10) / 10, note: note };
      } else {
        var rows = d.sets.filter(function (s) { return parseInt(s.r, 10) > 0; });
        var doneRows = rows.filter(function (s) { return s.done; });
        if (!rows.length) { showToast("回数を入力してください"); return; }
        if (doneRows.length && doneRows.length < rows.length) {
          if (!window.confirm("未完了のセットが" + (rows.length - doneRows.length) + "つあります。\n完了済みの" + doneRows.length + "セットだけ追加しますか？\n（キャンセルで編集に戻ります）")) return;
          rows = doneRows;
        }
        item = {
          exercise: d.exercise, part: d.part, weight_type: d.wtype === "片手" ? "片手" : "合計",
          sets: rows.map(function (s) {
            var w = parseFloat(s.w);
            return { w: (isFinite(w) && w > 0) ? w : null, r: parseInt(s.r, 10) };
          }),
          note: note
        };
      }
      if (d.editIdx != null && sess.items[d.editIdx]) sess.items[d.editIdx] = item;
      else sess.items.push(item);
      sess.draft = null;
      if (!writeSession()) return;
      go("session");
    }
    function setMenuAndRender(part, list) {
      if (setMenu(part, list)) render();
    }

    function onAct(act, el) {
      var d = sess && sess.draft;
      var i = parseInt(el.getAttribute("data-i"), 10);
      switch (act) {
        case "close": closeUi(); break;
        case "discard": discardSession(); break;
        // 開始画面
        case "start-part": {
          var p = el.getAttribute("data-part"), k = sv.startParts.indexOf(p);
          if (k === -1) sv.startParts.push(p); else sv.startParts.splice(k, 1);
          render();
          break;
        }
        case "start": startSession(); break;
        // メニュー設定
        case "menus":
          sv.menuBack = sv.view === "add" ? "add" : "start";
          sv.menuPart = (sv.menuBack === "add" ? sv.addPart : sv.startParts[0]) || allParts()[0];
          sv.menuFree = "";
          go("menus");
          break;
        case "menus-back":
          if (sv.menuBack === "add" && sess) { sv.addPart = sv.menuPart; sv.freeText = ""; go("add"); }
          else go(sess ? "session" : "start");
          break;
        case "m-part": sv.menuPart = el.getAttribute("data-part"); sv.menuFree = ""; render(); break;
        case "m-up": case "m-down": {
          var list = menuFor(sv.menuPart), j = act === "m-up" ? i - 1 : i + 1;
          if (j < 0 || j >= list.length || !isFinite(i)) break;
          var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
          setMenuAndRender(sv.menuPart, list);
          break;
        }
        case "m-del": {
          var l2 = menuFor(sv.menuPart);
          if (!isFinite(i) || i < 0 || i >= l2.length) break;
          l2.splice(i, 1);
          setMenuAndRender(sv.menuPart, l2);
          break;
        }
        case "m-add": {
          var nm = el.getAttribute("data-name"), l3 = menuFor(sv.menuPart);
          if (nm && l3.indexOf(nm) === -1) { l3.push(nm); setMenuAndRender(sv.menuPart, l3); }
          break;
        }
        case "m-free": {
          var fn = (sv.menuFree || "").trim(), l4 = menuFor(sv.menuPart);
          if (!fn) { var f1 = $("sessMFree"); if (f1) f1.focus(); break; }
          if (l4.indexOf(fn) !== -1) { showToast("すでに登録されています"); break; }
          l4.push(fn);
          sv.menuFree = "";
          setMenuAndRender(sv.menuPart, l4);
          break;
        }
        // セッション画面
        case "add":
          if (!sv.addPart) sv.addPart = (sess.parts[0]) || allParts()[0];
          sv.freeText = "";
          go("add");
          break;
        case "add-back": go("session"); break;
        case "add-part": sv.addPart = el.getAttribute("data-part"); sv.freeText = ""; render(); break;
        case "pick": openEditor(el.getAttribute("data-name")); break;
        case "pick-free": {
          var name = (sv.freeText || "").trim();
          if (!name) { var f2 = $("sessFree"); if (f2) f2.focus(); break; }
          openEditor(name);
          break;
        }
        case "edit":
          if (!sess.items[i]) break;
          sess.draft = draftFromItem(sess.items[i], i);
          writeSession();
          go("editor");
          break;
        case "del":
          if (!sess.items[i]) break;
          if (!window.confirm("「" + sess.items[i].exercise + "」を削除しますか。")) break;
          sess.items.splice(i, 1);
          writeSession();
          render();
          break;
        case "end": endSession(); break;
        case "sum-back": sv.summaryAt = null; go("session"); break;
        case "save": saveSession(); break;
        // 種目エディタ
        case "ed-back":
          if (!d) { go("session"); break; }
          if (d.editIdx == null && draftDirty(d) && !window.confirm("入力中の内容を破棄して戻りますか？")) break;
          sess.draft = null;
          writeSession();
          go(d.editIdx == null ? "add" : "session");
          break;
        case "wt":
          if (!d) break;
          d.wtype = el.getAttribute("data-w") === "片手" ? "片手" : "合計";
          Array.prototype.forEach.call($("sessWt").querySelectorAll(".ef-seg-btn"), function (b) { b.classList.toggle("active", b === el); });
          writeSession();
          break;
        case "wstep": {
          if (!d) break;
          var cur = parseFloat(d.minutes);
          if (!isFinite(cur)) cur = 0;
          var nv = Math.max(0, round2(cur + parseFloat(el.getAttribute("data-d"))));
          d.minutes = nv > 0 ? String(nv) : "";
          var inp = $("sessMinutes");
          if (inp) inp.value = d.minutes;
          writeSession();
          break;
        }
        case "setdone": {
          if (!d || !d.sets[i]) break;
          var s = d.sets[i];
          if (s.done) s.done = false;
          else {
            if (!(parseInt(s.r, 10) > 0)) {
              showToast("回数を入力してください");
              var ri = $("sessSets").querySelectorAll('input[data-sin="reps"]')[i];
              if (ri) ri.focus();
              break;
            }
            s.done = true;
            startRest();
          }
          var db = $("sessSets").querySelectorAll(".sess-done")[i];
          if (db) { db.classList.toggle("on", s.done); db.setAttribute("aria-pressed", s.done ? "true" : "false"); }
          writeSession();
          break;
        }
        case "addset": {
          if (!d) break;
          if (d.sets.length >= MAX_SETS) { showToast("セット数が上限です"); break; }
          var last = d.sets[d.sets.length - 1];
          d.sets.push({ w: last ? last.w : "", r: last ? last.r : "", done: false });
          $("sessSets").innerHTML = setsHtml(d);
          var setRows = $("sessSets").querySelectorAll(".sess-set");
          if (setRows.length && setRows[setRows.length - 1].scrollIntoView) setRows[setRows.length - 1].scrollIntoView({ block: "nearest" });
          writeSession();
          break;
        }
        case "delset":
          if (!d || !d.sets[i]) break;
          if (d.sets.length > 1) d.sets.splice(i, 1);
          else d.sets[0] = { w: d.sets[0].w, r: "", done: false };
          $("sessSets").innerHTML = setsHtml(d);
          writeSession();
          break;
        case "copyprev": {
          if (!d) break;
          var cardio = d.part === "有酸素";
          var pv = findPrevious(d.exercise, cardio);
          if (!pv) break;
          var pe = pv.entry;
          if (cardio) d.minutes = String(pe.minutes);
          else {
            var pw = (pe.weight_kg != null && pe.weight_kg > 0) ? String(pe.weight_kg) : "";
            d.wtype = pe.weight_type === "片手" ? "片手" : "合計";
            d.sets = pe.reps.map(function (r) { return { w: pw, r: String(r), done: false }; });
            if (!d.sets.length) d.sets = [{ w: pw, r: "", done: false }];
          }
          writeSession();
          render();
          showToast("前回をコピーしました");
          break;
        }
        case "commit": commitDraft(); break;
        // 休憩タイマー
        case "rest-preset": {
          var sec = parseInt(el.getAttribute("data-sec"), 10);
          if (!sess || REST_PRESETS.indexOf(sec) === -1) break;
          sess.restSec = sec;
          writeSession();
          if (rest.running) {
            rest.total = sec;
            rest.endAt = rest.startAt + sec * 1000;
            if (Date.now() >= rest.endAt) finishRest();
          }
          renderRestBar(true);
          break;
        }
        case "rest-skip": if (rest.running || rest.done) stopRest(); break;
      }
    }

    function onInput(key, el) {
      var d = sess && sess.draft;
      if (key === "free") { sv.freeText = el.value; return; }
      if (key === "mfree") { sv.menuFree = el.value; return; }
      if (!d) return;
      if (key === "reps") {
        var i = parseInt(el.getAttribute("data-i"), 10);
        if (d.sets[i]) d.sets[i].r = el.value;
      } else if (key === "w") {
        var wi = parseInt(el.getAttribute("data-i"), 10);
        if (d.sets[wi]) d.sets[wi].w = el.value;
      } else if (key === "minutes") d.minutes = el.value;
      else if (key === "note") d.note = el.value;
      else return;
      writeSession();
    }

    function bind() {
      var overlay = $("sessOverlay");
      overlay.addEventListener("click", function (e) {
        var t = e.target.closest ? e.target.closest("[data-sact]") : null;
        if (!t || t.disabled) return;
        onAct(t.getAttribute("data-sact"), t);
      });
      overlay.addEventListener("input", function (e) {
        var k = e.target.getAttribute ? e.target.getAttribute("data-sin") : null;
        if (k) onInput(k, e.target);
      });
      overlay.addEventListener("keydown", function (e) {
        if (e.key !== "Enter" || !e.target.getAttribute) return;
        var k = e.target.getAttribute("data-sin");
        if (k === "free") { e.preventDefault(); onAct("pick-free", e.target); }
        else if (k === "mfree") { e.preventDefault(); onAct("m-free", e.target); }
      });
      $("sessionOpenBtn").addEventListener("click", openSession);
      document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") tick(); });
      setInterval(tick, 250);
    }

    sessionApi.open = openSession;
    sessionApi.init = function () {
      sess = readSession();
      bind();
      updateEntryBtn();
    };
    // データ取得後に選択肢を最新化（入力中は邪魔しない）
    sessionApi.onData = function () {
      if (!sv.open) return;
      var ae = document.activeElement;
      if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA")) return;
      if (sv.view === "start" || sv.view === "add" || sv.view === "menus") render();
    };
  })();

  // ---------- タブ制御 ----------
  function renderCurrentTab() {
    if (!state.loaded) return;
    if (state.currentTab === "day") renderDayTab();
    else if (state.currentTab === "week") renderWeekTab();
    else if (state.currentTab === "month") renderMonthTab();
    else if (state.currentTab === "exercise") renderExerciseTab();
    else if (state.currentTab === "weight") renderWeightTab();
    else if (state.currentTab === "meal") renderMealTab();
    else if (state.currentTab === "photo") renderPhotoTab();
  }
  function isRecordPeriodTab(tab) {
    return tab === "day" || tab === "week" || tab === "month";
  }
  function switchTab(tab) {
    state.currentTab = tab;
    var isRecord = isRecordPeriodTab(tab);
    if (isRecord) saveRecordPeriod(tab);
    Array.prototype.forEach.call(document.querySelectorAll(".screen"), function (s) {
      s.classList.toggle("active", s.id === "screen-" + tab);
    });
    Array.prototype.forEach.call(document.querySelectorAll(".tab-btn"), function (b) {
      b.classList.toggle("active", b.getAttribute("data-screen") === (isRecord ? "record" : tab));
    });
    var segEl = document.getElementById("recordSegment");
    if (segEl) {
      segEl.classList.toggle("show", isRecord);
      Array.prototype.forEach.call(segEl.querySelectorAll(".record-seg-btn"), function (b) {
        b.classList.toggle("active", b.getAttribute("data-period") === tab);
      });
    }
    try { history.replaceState(null, "", isRecord ? "#record" : "#" + tab); } catch (e) {}
    renderCurrentTab();
  }
  function setRecordPeriod(period) {
    switchTab(period);
  }

  // ---------- イベント ----------
  document.getElementById("reloadBtn").addEventListener("click", function () { loadData(); });
  document.getElementById("dayPrevBtn").addEventListener("click", function () { changeDay(-1); });
  document.getElementById("dayNextBtn").addEventListener("click", function () { changeDay(1); });
  var dayDateInput = document.getElementById("dayDateInput");
  document.getElementById("dayLabel").addEventListener("click", function () {
    var range = dayNavRange();
    if (!range) return;
    dayDateInput.min = dateToKey(range.start);
    dayDateInput.max = dateToKey(range.end);
    dayDateInput.value = state.dayKey || dateToKey(range.end);
    if (dayDateInput.showPicker) {
      try { dayDateInput.showPicker(); } catch (e) { dayDateInput.focus(); }
    } else {
      dayDateInput.focus();
    }
  });
  dayDateInput.addEventListener("change", function () {
    if (!dayDateInput.value) return;
    var range = dayNavRange();
    if (!range) return;
    var d = dkToDate(dayDateInput.value);
    if (d.getTime() < range.start.getTime()) d = range.start;
    if (d.getTime() > range.end.getTime()) d = range.end;
    state.dayKey = dateToKey(d);
    renderDayTab();
  });
  document.addEventListener("click", function (e) {
    var cell = e.target.closest ? e.target.closest("[data-day-key]") : null;
    if (!cell) return;
    goToDay(cell.getAttribute("data-day-key"));
  });
  document.getElementById("weekPrevBtn").addEventListener("click", function () { changeWeek(-1); });
  document.getElementById("weekNextBtn").addEventListener("click", function () { changeWeek(1); });
  document.getElementById("monthPrevBtn").addEventListener("click", function () { changeMonth(-1); });
  document.getElementById("monthNextBtn").addEventListener("click", function () { changeMonth(1); });
  function changeDay(delta) {
    var range = dayNavRange();
    if (!range) return false;
    var curKey = state.dayKey || computeLatestDateKey() || dateToKey(range.end);
    var nd = addDays(dkToDate(curKey), delta);
    if (nd.getTime() < range.start.getTime() || nd.getTime() > range.end.getTime()) return false;
    state.dayKey = dateToKey(nd);
    renderDayTab();
    return true;
  }
  function goToDay(dateKey) {
    state.dayKey = dateKey;
    switchTab("day");
  }
  function changeWeek(delta) {
    state.weekStart = addDays(state.weekStart, delta * 7);
    renderWeekTab();
    return true;
  }

  Array.prototype.forEach.call(document.querySelectorAll(".tab-btn"), function (btn) {
    btn.addEventListener("click", function () {
      var screen = btn.getAttribute("data-screen");
      switchTab(screen === "record" ? getRecordPeriod() : screen);
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".record-seg-btn"), function (btn) {
    btn.addEventListener("click", function () { setRecordPeriod(btn.getAttribute("data-period")); });
  });

  document.getElementById("rawModalClose").addEventListener("click", closeRawModal);
  document.getElementById("rawModalOverlay").addEventListener("click", function (e) {

  function openSettingsModal() {

  Array.prototype.forEach.call(document.querySelectorAll(".theme-option"), function (btn) {

  if (themeMql) {

  document.addEventListener("click", function (e) {

  document.addEventListener("click", function (e) {

  });

  document.getElementById("photoFileInput").addEventListener("change", function () {
    var file = this.files && this.files[0];
    this.value = "";
    if (file) handlePhotoFile(file);
  });
  document.addEventListener("click", function (e) {
    var actEl = e.target.closest ? e.target.closest("[data-photo-act]") : null;
    if (actEl) {
      var act = actEl.getAttribute("data-photo-act");
      if (act === "pick") openPhotoPicker();
      else if (act === "delete") {
        if (!state.photoKey || !state.photoCache[state.photoKey]) return;
        if (!window.confirm("この日の写真を削除しますか。削除すると元に戻せません。")) return;
        deletePhoto(state.photoKey).then(function () { renderPhotoTab(); });
      } else if (act === "share") {
        sharePhoto(state.photoKey);
      } else if (act === "compare-toggle") {
        state.photoCompareOn = !state.photoCompareOn;
        if (!state.photoCompareOn) state.photoCompare = [];
        renderPhotoTab();
      } else if (act === "compare-clear") {
        state.photoCompare = [];
        renderPhotoTab();
      }
      return;
    }
    var keyEl = e.target.closest ? e.target.closest("[data-photo-key]") : null;
    if (keyEl) onPhotoKeySelect(keyEl.getAttribute("data-photo-key"));
  });

  // ---------- 横スワイプ（記録タブは画面全体、体重・食事はグラフ区間、写真は画面全体） ----------
  var SWIPE_DECIDE_DISTANCE = 10;
  var SWIPE_TRIGGER_DISTANCE = 60;
  var SWIPE_RATIO = 1.5;
  var SWIPE_EDGE_GUARD = 24;
  var SWIPE_TABS = { day: true, week: true, month: true, weight: true, meal: true, photo: true };
  var pgesture = { tracking: false, pointerId: null, startX: 0, startY: 0, lockDir: null, eligible: false };

  function isFormTarget(el) {
    while (el && el !== document.body) {
      if (el.nodeType === 1) {
        var tag = el.tagName.toLowerCase();
        if (tag === "input" || tag === "textarea" || tag === "select" || el.isContentEditable) return true;
      }
      el = el.parentElement;
    }
    return false;
  }
  function scrollableAncestorX(el) {
    while (el && el !== document.body && el !== document.documentElement) {
      if (el.nodeType === 1) {
        var style = window.getComputedStyle(el);
        if ((style.overflowX === "auto" || style.overflowX === "scroll") && el.scrollWidth > el.clientWidth) return el;
      }
      el = el.parentElement;
    }
    return null;
  }
  function isSwipeEligibleTarget(target, tab) {
    if (isFormTarget(target) || scrollableAncestorX(target)) return false;
    if (target.closest && (target.closest(".tabbar") || target.closest(".sess-overlay"))) return false;
    if (tab === "day" || tab === "week" || tab === "month" || tab === "photo") return true;
    if (tab === "weight" || tab === "meal") {
      return !!(target.closest && target.closest(".period-swipe-zone"));
    }
    return false;
  }
  function swipeEdgeOk(startX) {
    var vw = window.innerWidth || document.documentElement.clientWidth || 0;
    return startX >= SWIPE_EDGE_GUARD && startX <= vw - SWIPE_EDGE_GUARD;
  }
  function playSwipeAnim(el, dir) {
    if (!el) return;
    var offset = dir * 24;
    el.style.transition = "none";
    el.style.transform = "translateX(" + offset + "px)";
    el.style.opacity = "0.6";
    void el.offsetWidth;
    el.style.transition = "transform 200ms ease-out, opacity 200ms ease-out";
    el.style.transform = "translateX(0)";
    el.style.opacity = "1";
    window.setTimeout(function () {
      el.style.transition = "";
      el.style.transform = "";
      el.style.opacity = "";
    }, 220);
  }
  function triggerSwipeChange(dir) {
    var tab = state.currentTab;
    var el = document.querySelector(".screen.active");
    var changed = false;
    if (tab === "day") changed = changeDay(dir);
    else if (tab === "week") changed = changeWeek(dir);
    else if (tab === "month") changed = changeMonth(dir);
    else if (tab === "weight") changed = changeWeightPeriod(dir);
    else if (tab === "meal") changed = changeMealPeriod(dir);
    else if (tab === "photo") changed = changePhotoDay(dir);
    if (changed) playSwipeAnim(el, dir);
  }

  document.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1 || document.querySelector(".modal-overlay.show")) {
      gesture.tracking = false;
      return;
    }
    var target = e.target;
    gesture.tracking = true;
    gesture.startX = e.touches[0].clientX;
    gesture.startY = e.touches[0].clientY;
    gesture.lockDir = null;
    gesture.eligible = !!SWIPE_TABS[state.currentTab] && swipeEdgeOk(gesture.startX) && isSwipeEligibleTarget(target, state.currentTab);
  }, { passive: true });

  document.addEventListener("touchmove", function (e) {
    if (!gesture.tracking || e.touches.length !== 1) return;
    var touch = e.touches[0];
    var dx = touch.clientX - gesture.startX;
    var dy = touch.clientY - gesture.startY;
    var absDx = Math.abs(dx);
    var absDy = Math.abs(dy);
    if (gesture.lockDir === null) {
      if (absDx > SWIPE_DECIDE_DISTANCE && absDx > absDy * SWIPE_RATIO) {
        gesture.lockDir = "x";
      } else if (absDy > SWIPE_DECIDE_DISTANCE) {
        gesture.lockDir = "y";
      } else {
        return;
      }
    }
    if (gesture.lockDir === "x" && gesture.eligible) e.preventDefault();
  }, { passive: false });

  function gestureFinish(e) {
    if (!gesture.tracking) return;
    var locked = gesture.lockDir === "x" && gesture.eligible;
    gesture.tracking = false;
    if (!locked) return;
    var touch = e && e.changedTouches && e.changedTouches[0];
    if (!touch) return;
    var dx = touch.clientX - gesture.startX;
    var dy = touch.clientY - gesture.startY;
    if (Math.abs(dx) > SWIPE_TRIGGER_DISTANCE && Math.abs(dx) > Math.abs(dy) * SWIPE_RATIO) {
      triggerSwipeChange(dx < 0 ? 1 : -1);
    }
  }
  document.addEventListener("touchend", gestureFinish);
  document.addEventListener("touchcancel", function () { gesture.tracking = false; });

  // マウス・ペンなど touch 以外の pointer によるスワイプ（pointerType==="touch" は上の touch* 側に任せる）
  document.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "touch" || document.querySelector(".modal-overlay.show")) {
      pgesture.tracking = false;
      return;
    }
    pgesture.tracking = true;
    pgesture.pointerId = e.pointerId;
    pgesture.startX = e.clientX;
    pgesture.startY = e.clientY;
    pgesture.lockDir = null;
    pgesture.eligible = !!SWIPE_TABS[state.currentTab] && swipeEdgeOk(pgesture.startX) && isSwipeEligibleTarget(e.target, state.currentTab);
  });
  document.addEventListener("pointermove", function (e) {
    if (!pgesture.tracking || e.pointerId !== pgesture.pointerId) return;
    var dx = e.clientX - pgesture.startX;
    var dy = e.clientY - pgesture.startY;
    var absDx = Math.abs(dx);
    var absDy = Math.abs(dy);
    if (pgesture.lockDir === null) {
      if (absDx > SWIPE_DECIDE_DISTANCE && absDx > absDy * SWIPE_RATIO) {
        pgesture.lockDir = "x";
      } else if (absDy > SWIPE_DECIDE_DISTANCE) {
        pgesture.lockDir = "y";
      } else {
        return;
      }
    }
    if (pgesture.lockDir === "x" && pgesture.eligible) e.preventDefault();
  }, { passive: false });
  function pgestureFinish(e) {
    if (!pgesture.tracking || e.pointerId !== pgesture.pointerId) return;
    var locked = pgesture.lockDir === "x" && pgesture.eligible;
    pgesture.tracking = false;
    if (!locked) return;
    var dx = e.clientX - pgesture.startX;
    var dy = e.clientY - pgesture.startY;
    if (Math.abs(dx) > SWIPE_TRIGGER_DISTANCE && Math.abs(dx) > Math.abs(dy) * SWIPE_RATIO) {
      triggerSwipeChange(dx < 0 ? 1 : -1);
    }
  }
  document.addEventListener("pointerup", pgestureFinish);
  document.addEventListener("pointercancel", function (e) {
    if (e.pointerId === pgesture.pointerId) pgesture.tracking = false;
  });

  // ---------- ダブルタップズーム防止（iOS Safari 対策） ----------
  var lastTouchEndAt = 0;
  document.addEventListener("touchend", function (e) {
    if (isFormTarget(e.target) || (e.target.closest && e.target.closest(".entry-box, .sess-overlay"))) { lastTouchEndAt = 0; return; }
    var now = Date.now();
    if (now - lastTouchEndAt <= 300) {
      e.preventDefault();
      lastTouchEndAt = 0;
    } else {
      lastTouchEndAt = now;
    }
  }, { passive: false });
  document.addEventListener("dblclick", function (e) {
    if (isFormTarget(e.target)) return;
    e.preventDefault();
  }, { passive: false });

  // ---------- アプリ更新チェック ----------
  var RELOADED_VERSION_KEY = "kintore_reloaded_version";
  function checkAppUpdate() {
    fetch("index.html?t=" + Date.now(), { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("http " + res.status);
        return res.text();
      })
      .then(function (text) {
        var m = text.match(/var\s+APP_VERSION\s*=\s*["']([^"']+)["']/);
        if (!m) return;
        var latest = m[1];
        if (latest === APP_VERSION) return;
        var already = null;
        try { already = sessionStorage.getItem(RELOADED_VERSION_KEY); } catch (e) {}
        if (already === latest) return;
        try { sessionStorage.setItem(RELOADED_VERSION_KEY, latest); } catch (e) {}
        location.replace(location.pathname + "?v=" + encodeURIComponent(latest));
      })
      .catch(function () {});
  }

  // ---------- 初期化 ----------
  function initialTabFromHash() {
    var h = (location.hash || "").replace("#", "");
    if (h === "exercise" || h === "weight" || h === "meal" || h === "photo") return h;
    if (h === "day" || h === "week" || h === "month") return h;
    return getRecordPeriod();
  }
  function init() {
    sessionApi.init();
    loadGoalSettings();
    var initial = initialTabFromHash();
    switchTab(initial);
    loadData();
    initPhotos();
    checkAppUpdate();
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") {
      loadData();
      checkAppUpdate();
    }
  });
  window.addEventListener("pageshow", function () {
    loadData();
    checkAppUpdate();
  });

  init();
})();
</script>
